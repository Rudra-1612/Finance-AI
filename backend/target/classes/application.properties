server.port=8080

# ============================================================
# Database (MySQL)
# ============================================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/financeai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# ============================================================
# Auth
# ============================================================
financeai.jwt.secret=FinanceAI-SuperSecret-JWT-Signing-Key-2024-ChangeMeInProduction-LongEnough
financeai.jwt.expiration-ms=604800000
financeai.seed-demo-data=true

# ============================================================
# AI Advisor - OpenAI (optional)
# Set OPENAI_API_KEY to enable GPT streaming. When empty, a
# built-in rule-based financial analysis engine is used instead.
# ============================================================
financeai.openai.api-key=
financeai.openai.model=gpt-4o-mini
financeai.openai.enabled=false

# ============================================================
# Static resources (frontend served from the frontend/ folder)
# ============================================================
spring.web.resources.static-locations=file:./frontend/,classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.max-age=0

# ============================================================
# Misc
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.financeai=INFO
logging.level.org.hibernate.SQL=WARN
server.error.include-message=never