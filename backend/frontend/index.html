<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanceAI — Your Intelligent Money Companion</title>
  <meta name="description" content="FinanceAI: an intelligent personal finance platform for budgeting, savings, investments and AI-powered financial advice." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>" />
</head>
<body>
  <!-- Public landing / auth views -->
  <div id="public-view" class="public-view"></div>

  <!-- App shell (authenticated) -->
  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-mark">Fa</span>
          <span class="brand-name">Finance<span class="brand-accent">AI</span></span>
        </div>
        <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-foot">
        <a class="advisor-pill" href="#/advisor">
          <span class="pill-dot"></span>
          <span>Ask the AI Advisor</span>
        </a>
        <div class="user-chip" id="userChip"></div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="sidebarOpen" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-actions">
          <button class="icon-btn" id="notifBtn" aria-label="Notifications" title="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span class="badge-dot hidden" id="notifBadge"></span>
          </button>
          <button class="avatar-btn" id="avatarBtn" aria-label="Account">
            <span id="avatarText">?</span>
          </button>
        </div>
      </header>
      <section class="content" id="view"></section>
    </main>
  </div>

  <!-- Toast container -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- Modal root -->
  <div class="modal-root hidden" id="modalRoot">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-panel" id="modalPanel" role="dialog" aria-modal="true"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
